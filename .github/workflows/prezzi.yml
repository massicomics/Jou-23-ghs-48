name: Prezzi

on:
  schedule:
    - cron: '*/10 7-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa la libreria
        run: pip install --quiet yfinance

      - name: Scarica le quotazioni
        run: |
          python3 - << 'EOF'
          import json, time
          import yfinance as yf

          SIMBOLI = ["PRY.MI", "HO.PA", "AMZN", "NFLX", "AZN", "EURUSD=X"]
          fuori = {}

          for s in SIMBOLI:
              p = None; t = 0; st = ""; cur = ""
              try:
                  tk = yf.Ticker(s)
                  fi = tk.fast_info
                  p = float(fi["last_price"])
                  cur = fi.get("currency") or ""
              except Exception as e:
                  print(s, "fast_info ->", e)
              if not p or p <= 0:
                  try:
                      h = tk.history(period="1d", interval="1m")
                      if len(h):
                          p = float(h["Close"].iloc[-1])
                          t = int(h.index[-1].timestamp())
                  except Exception as e:
                      print(s, "history ->", e)
              if p and p > 0:
                  if not t:
                      t = int(time.time())
                  fuori[s] = {"p": round(p, 4), "t": t, "st": st, "cur": cur}
                  print("ok", s, round(p, 4))
              else:
                  print("FALLITO", s)
              time.sleep(1)

          try:
              with open("prezzi.json") as f:
                  vecchio = json.load(f).get("prezzi", {})
              for k, v in vecchio.items():
                  fuori.setdefault(k, v)
          except Exception:
              pass

          if not fuori:
              raise SystemExit("nessun prezzo disponibile")

          with open("prezzi.json", "w") as f:
              json.dump({"aggiornato": int(time.time()), "prezzi": fuori},
                        f, indent=1, ensure_ascii=False)
          print("scritti", len(fuori), "simboli")
          EOF

      - name: Salva nel repository
        run: |
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add prezzi.json
          git diff --staged --quiet || git commit -m "prezzi $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
